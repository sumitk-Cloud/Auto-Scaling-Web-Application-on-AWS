<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrCw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C7131F"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#232F3E">Highly Available Auto-Scaling Web Application (Multi-AZ)</text>

  <!-- Internet -->
  <ellipse cx="450" cy="62" rx="90" ry="20" fill="#f2f3f3" stroke="#232F3E"/>
  <text x="450" y="67" text-anchor="middle" font-size="13" fill="#232F3E">Internet / Users</text>
  <line x1="450" y1="82" x2="450" y2="108" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- IGW -->
  <rect x="360" y="108" width="180" height="40" rx="6" fill="#fff3e6" stroke="#ED7100" stroke-width="2"/>
  <text x="450" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Internet Gateway (ha-project-igw)</text>
  <line x1="450" y1="148" x2="450" y2="205" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- VPC -->
  <rect x="40" y="165" width="820" height="520" rx="8" fill="none" stroke="#248814" stroke-width="2.5"/>
  <text x="55" y="187" font-size="13" font-weight="bold" fill="#248814">VPC: ha-project-vpc (10.0.0.0/16)</text>

  <!-- ALB -->
  <rect x="100" y="205" width="700" height="64" rx="8" fill="#fff3e6" stroke="#ED7100" stroke-width="2"/>
  <text x="450" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Application Load Balancer (ha-web-alb, internet-facing)</text>
  <text x="450" y="251" text-anchor="middle" font-size="12" fill="#232F3E">alb-sg: HTTP 80 from 0.0.0.0/0  |  Target group ha-web-tg  |  Health check: /health.html</text>

  <!-- Arrows ALB -> instances -->
  <line x1="180" y1="269" x2="180" y2="410" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="269" x2="570" y2="410" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="290" font-size="11" fill="#232F3E">routes to healthy targets only</text>
  <text x="580" y="290" font-size="11" fill="#232F3E">routes to healthy targets only</text>

  <!-- ASG outline -->
  <rect x="55" y="300" width="790" height="365" rx="8" fill="none" stroke="#ED7100" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="450" y="640" text-anchor="middle" font-size="13" font-weight="bold" fill="#ED7100">Auto Scaling Group: ha-web-asg  (min 2 | desired 2 | max 5)</text>
  <text x="450" y="656" text-anchor="middle" font-size="11" fill="#232F3E">Launch template ha-web-lt (Amazon Linux 2023, Apache via user data) | ELB health checks | Target tracking: avg CPU 50%</text>

  <!-- AZ A -->
  <rect x="75" y="335" width="370" height="270" rx="6" fill="#fafafa" stroke="#7d8998" stroke-dasharray="3 3"/>
  <text x="435" y="355" text-anchor="end" font-size="12" font-weight="bold" fill="#232F3E">Availability Zone A</text>
  <rect x="90" y="370" width="340" height="220" rx="6" fill="#e8f3fb" stroke="#147EBA" stroke-width="1.5"/>
  <text x="420" y="390" text-anchor="end" font-size="12" fill="#147EBA">public-subnet-a (10.0.1.0/24)</text>
  <rect x="110" y="410" width="140" height="75" rx="6" fill="#ffffff" stroke="#ED7100" stroke-width="1.5"/>
  <text x="180" y="437" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">EC2 instance</text>
  <text x="180" y="454" text-anchor="middle" font-size="11" fill="#232F3E">Apache httpd</text>
  <text x="180" y="470" text-anchor="middle" font-size="11" fill="#232F3E">ec2-sg (80 from alb-sg)</text>
  <rect x="270" y="410" width="140" height="75" rx="6" fill="#ffffff" stroke="#ED7100" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="340" y="442" text-anchor="middle" font-size="12" fill="#232F3E">Scale-out</text>
  <text x="340" y="459" text-anchor="middle" font-size="12" fill="#232F3E">instances</text>
  <text x="340" y="475" text-anchor="middle" font-size="11" fill="#7d8998">(added on demand)</text>
  <rect x="110" y="510" width="300" height="55" rx="6" fill="#ffffff" stroke="#7d8998"/>
  <text x="260" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Route table: public-rt</text>
  <text x="260" y="550" text-anchor="middle" font-size="11" fill="#232F3E">10.0.0.0/16 local | 0.0.0.0/0 to IGW</text>

  <!-- AZ B -->
  <rect x="465" y="335" width="370" height="270" rx="6" fill="#fafafa" stroke="#7d8998" stroke-dasharray="3 3"/>
  <text x="825" y="355" text-anchor="end" font-size="12" font-weight="bold" fill="#232F3E">Availability Zone B</text>
  <rect x="480" y="370" width="340" height="220" rx="6" fill="#e8f3fb" stroke="#147EBA" stroke-width="1.5"/>
  <text x="810" y="390" text-anchor="end" font-size="12" fill="#147EBA">public-subnet-b (10.0.2.0/24)</text>
  <rect x="500" y="410" width="140" height="75" rx="6" fill="#ffffff" stroke="#ED7100" stroke-width="1.5"/>
  <text x="570" y="437" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">EC2 instance</text>
  <text x="570" y="454" text-anchor="middle" font-size="11" fill="#232F3E">Apache httpd</text>
  <text x="570" y="470" text-anchor="middle" font-size="11" fill="#232F3E">ec2-sg (80 from alb-sg)</text>
  <rect x="660" y="410" width="140" height="75" rx="6" fill="#ffffff" stroke="#ED7100" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="730" y="442" text-anchor="middle" font-size="12" fill="#232F3E">Scale-out</text>
  <text x="730" y="459" text-anchor="middle" font-size="12" fill="#232F3E">instances</text>
  <text x="730" y="475" text-anchor="middle" font-size="11" fill="#7d8998">(added on demand)</text>
  <rect x="500" y="510" width="300" height="55" rx="6" fill="#ffffff" stroke="#7d8998"/>
  <text x="650" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Route table: public-rt</text>
  <text x="650" y="550" text-anchor="middle" font-size="11" fill="#232F3E">10.0.0.0/16 local | 0.0.0.0/0 to IGW</text>

  <!-- CloudWatch -->
  <rect x="900" y="420" width="170" height="90" rx="8" fill="#fdecea" stroke="#C7131F" stroke-width="2"/>
  <text x="985" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Amazon CloudWatch</text>
  <text x="985" y="470" text-anchor="middle" font-size="11" fill="#232F3E">CPUUtilization metric</text>
  <text x="985" y="487" text-anchor="middle" font-size="11" fill="#232F3E">AlarmHigh / AlarmLow</text>
  <line x1="900" y1="465" x2="846" y2="465" stroke="#C7131F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrCw)"/>
  <text x="985" y="535" text-anchor="middle" font-size="11" fill="#C7131F">CPU above 50%: scale out</text>
  <text x="985" y="551" text-anchor="middle" font-size="11" fill="#C7131F">CPU below 50%: scale in</text>

  <!-- Admin access note -->
  <rect x="900" y="590" width="170" height="60" rx="8" fill="#f2f3f3" stroke="#7d8998"/>
  <text x="985" y="615" text-anchor="middle" font-size="11" font-weight="bold" fill="#232F3E">Admin access</text>
  <text x="985" y="632" text-anchor="middle" font-size="11" fill="#232F3E">SSM Session Manager</text>
  <text x="985" y="645" text-anchor="middle" font-size="11" fill="#232F3E">(no inbound SSH)</text>
</svg>
